name: notices

# 공지사항·공지 알림 (docs/NOTICES_PUSH.md)
# ① main 에 notices/** 가 머지되면: 검증 → 서명(팩과 같은 키) → Firestore notices/current 에 올린다.
#    공지 그림(hosting/public/notices/**)이 바뀌었으면 Hosting 도 배포한다 — 배포는 사이트 전체를 바꾸므로 팩을 먼저 다시 만든다.
# ② 손으로 부르면(workflow_dispatch, notice_id 를 적으면): 같은 검증 → (dry_run 이 아니면) 올리기 → FCM 토픽 알림.
#    알림 메시지에는 글이 없다({type, id, v, cat}). 앱이 서명된 공지를 받아 그 제목·본문으로 알린다. 토큰은 저장하지 않는다(토픽만).
# 필요한 secrets (deploy-packs·videos 와 같은 것, 사람이 등록):
#   PACK_SIGNING_KEY_PEM       — 팩과 같은 Ed25519 서명 개인키(PEM)
#   FIREBASE_SERVICE_ACCOUNT   — Firestore 쓰기(Cloud Datastore 사용자) + FCM 보내기(Firebase Cloud Messaging API 관리자)
#                                 (+ 그림을 올릴 때 Hosting 배포) 권한이 있는 서비스 계정
# 키가 아직 없으면 경고만 남기고 성공으로 끝난다.

on:
  push:
    branches: [main]
    paths:
      - "notices/**"
      - "hosting/public/notices/**"
  workflow_dispatch:
    inputs:
      notice_id:
        description: "알림을 보낼 공지 id (비우면 검증·올리기만)"
        required: false
        default: ""
      target:
        description: "all 또는 나라 코드 두 글자(TH 등)"
        required: false
        default: "all"
      dry_run:
        description: "시험 실행 — 올리지도 보내지도 않는다"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: readyport-app
      PACK_KID: rp-2026-1
      # 손으로 넣은 값은 셸에 그대로 끼우지 않고 환경 변수로만 넘긴다(스크립트 주입 방지). 형식 검사는 build_notices.py 가 한다
      NOTICE_ID: ${{ inputs.notice_id }}
      TARGET: ${{ inputs.target || 'all' }}
      WANT_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.notice_id != '' }}
      REAL_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install -r tools/packs/requirements.txt google-auth requests
      - name: Tests (validator, payload, FCM message, operator dry-run)
        run: python -m unittest tools/notices/test_notices.py
      - name: Validate notices
        run: python tools/notices/build_notices.py check
      - name: Check the push request (dry run — nothing is sent)
        if: env.WANT_PUSH == 'true'
        run: python tools/notices/build_notices.py fcm --id "$NOTICE_ID" --target "$TARGET"
      - name: Secrets present?
        id: secrets
        env:
          PACK_SIGNING_KEY_PEM: ${{ secrets.PACK_SIGNING_KEY_PEM }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PACK_SIGNING_KEY_PEM" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning title=공지 건너뜀::PACK_SIGNING_KEY_PEM 또는 FIREBASE_SERVICE_ACCOUNT 가 없어 올리지 않았어요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Credentials
        if: steps.secrets.outputs.ok == 'true' && env.REAL_RUN == 'true'
        env:
          PACK_SIGNING_KEY_PEM: ${{ secrets.PACK_SIGNING_KEY_PEM }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s\n' "$PACK_SIGNING_KEY_PEM" > "$RUNNER_TEMP/pack_key.pem"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Sign and upload Firestore notices/current
        if: steps.secrets.outputs.ok == 'true' && env.REAL_RUN == 'true'
        run: python tools/notices/build_notices.py upload --kid "$PACK_KID" --key "$RUNNER_TEMP/pack_key.pem"
      - name: Notice images changed?
        id: images
        if: github.event_name == 'push'
        run: |
          if git diff --name-only HEAD~1 HEAD -- hosting/public/notices | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # Hosting 배포는 사이트 전체를 바꾼다 — 서명된 팩(hosting/public/packs, 커밋하지 않음)을 먼저 다시 만들지 않으면 팩이 사라진다
      - name: Rebuild signed packs (Hosting deploy replaces the whole site)
        if: steps.images.outputs.changed == 'true' && steps.secrets.outputs.ok == 'true'
        run: |
          python tools/packs/build_packs.py --kid "$PACK_KID" --key "$RUNNER_TEMP/pack_key.pem"
          git diff --exit-code -- app/src/main/assets/packs
          # 관광지 서명본(커밋된 것)도 같이 올린다 — 빠지면 Hosting 에서 사라진다(SPEC_v5 §10.1)
          python tools/deploy/stage_hosting.py
      - uses: actions/setup-node@v4
        if: steps.images.outputs.changed == 'true' && steps.secrets.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Deploy Hosting (notice images)
        if: steps.images.outputs.changed == 'true' && steps.secrets.outputs.ok == 'true'
        run: npx --yes firebase-tools@15 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Send notice push (FCM topic)
        # deploy-packs 와 같은 교훈: 403이면 대개 서비스 계정 역할이 없거나 FCM API가 꺼져 있다 — 경고로 남기고 공지 올리기는 성공으로 둔다
        if: env.WANT_PUSH == 'true' && env.REAL_RUN == 'true' && steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: python tools/notices/build_notices.py fcm --id "$NOTICE_ID" --target "$TARGET" --send
      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/pack_key.pem"
