name: purge-reports

# 개인정보처리방침의 보관 기간을 지킨다: expire_at(수집 후 약 1년)이 지난 익명 실패 리포트를 매월 지운다.
# (Firestore 자동 삭제(TTL)는 유료 요금제 전용이라 Spark에서는 이 작업으로 대신한다)
# 필요한 secret: FIREBASE_SERVICE_ACCOUNT — 서비스 계정에 'Cloud Datastore 사용자' 역할이 있어야 지울 수 있다.

on:
  schedule:
    - cron: "40 0 1 * *"   # 매월 1일 09:40 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: readyport-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install google-auth requests
      - name: Service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Delete expired field reports
        run: python tools/deploy/ci_deploy.py purge-reports
      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
